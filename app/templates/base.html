<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}filetree_coop{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">📁 filetree_coop</a>
    {% if user %}
    <button id="nav-toggle" class="nav-toggle" type="button"
            aria-label="Menü öffnen" aria-expanded="false" aria-controls="main-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
    <nav id="main-nav">
      <a href="/">Quellen</a>
      <a href="/browse">Baum</a>
      <a href="/search">Suche</a>
      <a href="/notes">Notizen</a>
      <a href="/overview">Übersicht</a>
      <a href="/storage">Speicher</a>
      <a href="/handovers" id="nav-handovers">Übergaben</a>
      <a href="/calendar" id="nav-calendar">Kalender</a>
      <a href="/activity" id="nav-activity">Aktivität</a>
      <a href="/llm">KI</a>
      <span class="spacer"></span>
      <a href="/profile" class="who" title="Profil & Einstellungen">{{ user.display_name }}</a>
      <button id="logout-btn" class="link-btn">Abmelden</button>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/paths.js"></script>
  <script src="/static/js/entry_ui.js"></script>
  {% if user %}<script src="/static/js/palette.js"></script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
