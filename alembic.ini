# Alembic-Konfiguration. Die DB-URL wird zur Laufzeit aus app.config.settings
# gesetzt (siehe migrations/env.py bzw. app.db.init_db) – hier steht nur der
# Fallback für manuelle CLI-Aufrufe.
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./filetree_coop.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
